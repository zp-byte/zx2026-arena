# =============================================================================
# scene_topology.yaml — 科目三 场地拓扑（干净静态场景版）
# 由 arena_world 解析。换场地/换投放点只改本文件，不改代码。
# =============================================================================

venue:
  size: [120, 100, 6]        # 120m × 100m × 6m 总场地
  ground_z: 0.0

# ---- 分区 -------------------------------------------------------------------
zones:
  - id: takeoff            # 起降区（6 个起降点）
    kind: pad
    polygon: [[-27, 5.75], [-19, 5.75], [-19, 12.25], [-27, 12.25]]
    pads: 6
    pad_spacing: [1.5, 1.5]
    pad_origin: [-25.5, 7.25]   # 第 0 号起降点地面坐标
  - id: transit            # 穿越区/障碍区（静态树）
    kind: forest
    polygon: [[-60, -50], [60, -50], [60, 50], [-60, 50]]
    forest:
      generator: "static"
      drop_clearance: 1.5
      density_seed: 42
      tree_sets:
        # 主树林：7 列 × 6 行网格，42 棵（更密集但仍有序）
        - layout: grid
          count: 42
          cols: 7
          origin: [-12.0, -10.5]
          spacing: [4.1, 4.3]
          jitter: 2.0
          trunk_r: [0.18, 0.28]
          height: 3.2
          crown_r: 1.2
        # 起降区 → 终点方向一排，12 棵
        - layout: line
          count: 12
          start: [-18.0, 11.0]
          end: [20.0, 11.0]
          jitter: 1.5
          trunk_r: [0.18, 0.28]
          height: 3.2
          crown_r: 1.2
  - id: return             # 降落区（复用起降区）
    kind: ref
    ref: takeoff

# ---- 穿越区（强制通过） --------------------------------------------------------
crossing_zone:
  polygon: [[-5, -2], [7, -2], [7, 6], [-5, 6]]   # 12 × 8，中心 (1, 2)

# ---- 投送平台（场地右侧林区外缘，规则：3 平台/直径 1.2m） ------------------------
# 规则口径：3 个投送点（直径约 1.2m 投掷平台），颜色区分补给类型；颜色-类型
# 对应赛前不告知，机载须自主识别（color_id 闭环，bucket_select.py）。
# color_map 是颜色权威源：Gazebo 材质 / RViz 平台标 / tag 检测三端共用，
# 禁止另设硬编码色表（world_builder 双色表教训）。
color_map:
  TYPE_A: red        # 电池箱 → 红
  TYPE_B: blue       # 药品箱 → 蓝
  TYPE_C: yellow     # 食品箱 → 黄

drop_points:
  - id: 1
    xyz: [19.5, -6, 0.0]
    type_id: TYPE_A
    color: red
    marker: "36h11_101"
  - id: 2
    xyz: [19.5,  0, 0.0]
    type_id: TYPE_B
    color: blue
    marker: "36h11_102"
  - id: 3
    xyz: [19.5,  6, 0.0]
    type_id: TYPE_C
    color: yellow
    marker: "36h11_103"

# ---- 投放类型清单（每架携带物品类型取值空间） --------------------------------
payload_types: [TYPE_A, TYPE_B, TYPE_C]

# ---- 静态障碍物（路缘、围栏、标识柱） -----------------------------------------
# 坐标系：x-y 水平面，z 向上
static_obstacles:
  # 主场地路缘石：34 × 26 场地，内缩 0.5m 白线，路缘在外圈
  # 场地范围 x∈[-17,17], y∈[-13,13]，路缘厚 0.5m、高 0.32m
  - kind: curb
    lo: [-17.25,  12.75, 0.0]
    hi: [ 17.25,  13.25, 0.32]
  - kind: curb
    lo: [-17.25, -13.25, 0.0]
    hi: [ 17.25, -12.75, 0.32]
  - kind: curb
    lo: [-17.25, -12.75, 0.0]
    hi: [-16.75,  12.75, 0.32]
  - kind: curb
    lo: [ 16.75, -12.75, 0.0]
    hi: [ 17.25,  12.75, 0.32]
  # 外围围栏（场地外围：左/前/后 + 右侧外移围住投放区）
  # 右围栏外移至 x≈22.5，把投放点(19.5)与标识柱(20~22)纳入围栏内；
  # 否则投放点在围栏外侧、2.5D A* 不可达，且下降时擦碰围栏顶角。
  - kind: fence
    lo: [-18.75, -15.50, 0.0]
    hi: [-18.45,  15.50, 1.30]
  - kind: fence
    lo: [ 22.50, -15.50, 0.0]
    hi: [ 22.80,  15.50, 1.30]
  - kind: fence
    lo: [-18.60,  15.35, 0.0]
    hi: [ 22.80,  15.65, 1.30]
  - kind: fence
    lo: [-18.60, -15.65, 0.0]
    hi: [ 22.80, -15.35, 1.30]
  # 注：旧场景的"彩色标识柱"已删除——规则口径下平台色即显著标识，
  # 且柱体(h1.15)会在低空层(0.55m)把平台心 goal 的 A* 规划围死
  # （RECON GOTO_LO plan_fail 活锁根因，2026-09-08 法证）。

# ---- 评分配置 ---------------------------------------------------------------
score:
  path_quality:
    # 路径效率奖励：直线距离 / 实际路径长度，范围 (0,1]
    straightness_bonus: true
    weight: 0.5         # 路径质量奖励 = base * weight * straightness
  crossing_zone:
    required: true
    miss_penalty: -50   # 未通过穿越区扣分

# ---- 可视化（RViz Marker 用） ------------------------------------------------
visual:
  zone_alpha: 0.15
  drop_marker_scale: [0.6, 0.6, 0.3]
  forest_marker_scale: [0.3, 0.3, 2.5]
