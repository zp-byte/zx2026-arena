# =============================================================================
# scene_topology.yaml — 科目三 场地拓扑（杨树林版，2026-09-23 场景替换）
# 来源：外部杨树林 Gazebo 场景（/mnt/d/gazebo_forest/forest_poplar.sdf，
# seed=42）经 tools/import_poplar_sdf.py 转换为显式树表导入。
# 飞行体制：冠下穿行——树高 6.7~12.3m、冠下缘最低 2.81m，巡航 1.2m
# （competition_rules.yaml heights.cruise_z 同步），树干圆柱=硬碰撞。
# 换场地/换投放点只改本文件（+树表），不改代码。
# =============================================================================

venue:
  size: [70, 70, 14]         # 70m × 70m 场地（林带 60×60 外扩围栏），z 上限盖过最高树
  ground_z: 0.0

# ---- 分区 -------------------------------------------------------------------
zones:
  - id: takeoff            # 起降区（6 个起降点，西清理带 x∈[-30,-24]）
    kind: pad
    polygon: [[-30, -15], [-24, -15], [-24, 15], [-30, 15]]
    pads: 6
    pad_spacing: [1.5, 7.5]
    pad_origin: [-27.75, -3.75]   # 第 0 号起降点地面坐标（3 列 × 2 行）
  - id: transit            # 穿越区/障碍区（杨树林显式树表）
    kind: forest
    polygon: [[-30, -30], [30, -30], [30, 30], [-30, 30]]
    forest:
      generator: "table"
      table_file: "forest_poplar_table.yaml"   # tools/import_poplar_sdf.py 输出
      drop_clearance: 1.5
      density_seed: 42        # table 模式不消耗 rng（保留字段兼容旧读法）
  - id: return             # 降落区（复用起降区）
    kind: ref
    ref: takeoff

# ---- 穿越区（强制通过=整条林带） ----------------------------------------------
crossing_zone:
  polygon: [[-24, -28], [28, -28], [28, 28], [-24, 28]]   # 52 × 56 林带

# ---- 投送平台（东林缘一列 3 平台，坐标=树表转换器自动选点，净空 1.64~2.22m） ----
# 规则口径：3 个投送点（直径约 1.2m 投掷平台），颜色区分补给类型；颜色-类型
# 对应赛前不告知，机载须自主识别（color_id 闭环，bucket_select.py）。
# color_map 是颜色权威源：Gazebo 材质 / RViz 平台标 / tag 检测三端共用，
# 禁止另设硬编码色表（world_builder 双色表教训）。
color_map:
  TYPE_A: red        # 电池箱 → 红
  TYPE_B: blue       # 药品箱 → 蓝
  TYPE_C: yellow     # 食品箱 → 黄

drop_points:
  - id: 1
    xyz: [27.0, -9.0, 0.0]
    type_id: TYPE_A
    color: red
    marker: "36h11_101"
  - id: 2
    xyz: [26.75, -0.25, 0.0]
    type_id: TYPE_B
    color: blue
    marker: "36h11_102"
  - id: 3
    xyz: [27.0, 9.0, 0.0]
    type_id: TYPE_C
    color: yellow
    marker: "36h11_103"

# ---- 投放类型清单（每架携带物品类型取值空间） --------------------------------
payload_types: [TYPE_A, TYPE_B, TYPE_C]

# ---- 静态障碍物（外围围栏） ----------------------------------------------------
# 坐标系：x-y 水平面，z 向上。林地无路缘石（旧 court 路缘已删）；
# 围栏加高 1.30→2.80：冠下飞行体制下围栏是真实侧墙（巡航 1.2 < 顶 2.8），
# 围栏点进占用图=正确语义；同时 2.80 > 点云高度带上限 2.6，围栏顶缘点仍被
# 挡在带外（W5 围栏顶幻影墙教训在新体制下的等价保持）。
static_obstacles:
  - kind: fence
    lo: [-30.30, -30.30, 0.0]
    hi: [-30.00,  30.30, 2.80]
  - kind: fence
    lo: [ 30.00, -30.30, 0.0]
    hi: [ 30.30,  30.30, 2.80]
  - kind: fence
    lo: [-30.30,  30.00, 0.0]
    hi: [ 30.30,  30.30, 2.80]
  - kind: fence
    lo: [-30.30, -30.30, 0.0]
    hi: [ 30.30, -30.00, 2.80]

# ---- 评分配置 ---------------------------------------------------------------
score:
  path_quality:
    # 路径效率奖励：直线距离 / 实际路径长度，范围 (0,1]
    straightness_bonus: true
    weight: 0.5         # 路径质量奖励 = base * weight * straightness
  crossing_zone:
    required: true
    miss_penalty: -50   # 未通过穿越区扣分

# ---- 可视化（RViz Marker 用） ------------------------------------------------
visual:
  zone_alpha: 0.15
  drop_marker_scale: [0.6, 0.6, 0.3]
  forest_marker_scale: [0.25, 0.25, 8.0]
