# =============================================================================
# sim_settings.yaml — 仿真运行设置
# 切换物理后端 / 保真度 / 时间管理 / 随机种子
# =============================================================================

run_seed: 42               # 一切随机种子（同 seed 可复现）

# ---- 物理后端 ----------------------------------------------------------------
backend: cascade_pid       # kinematic | cascade_pid | gazebo
kinematic:
  yaw_rate_max: 1.5
cascade_pid:
  pos_kp: [1.2, 1.2, 1.5]
  vel_kp: [2.0, 2.0, 2.5]
  vel_kd: [0.6, 0.6, 0.4]
  max_tilt_deg: 30.0
  max_vel: 2.5
gazebo:
  # 预留：外部 gzserver 连接参数（S7 可选后端，本文件仅占位）
  host: 127.0.0.1
  port: 11345

# ---- 导航规划 ----------------------------------------------------------------
nav:
  resolution: 0.5          # A* 栅格分辨率 (m)
  inflation: 0.4           # 额外安全边距 (m)；实际膨胀 = drone_radius + inflation。
                           # 【0.4 定论】栅格 ceil 粒度无中间档（0.55 与 0.4 同为
                           # 2 格膨胀）；0.9=多 1 格 → A* 绕行变长（m09_43 直线度
                           # 0.31 vs 典型 0.45），3/3 满窗超时 FAIL——零碰撞零 de
                           # 零 stall，到期仅投 4-6/6，纯慢不是封死
                           # （run_logs/batch1_20260901_145602）。重评条件：连续
                           # 距离场膨胀（半格精度）或赛制窗口加长。
  separation_radius: 1.5   # 多机防撞：进入该半径(m)即叠加分离速度
  separation_gain: 3.5     # 分离速度增益
  metrics:
    enabled: true          # P0 指标埋点（纯观测，不改行为）：/drone_<i>/nav_metrics
                           # 收集器 nav_metrics_node 落盘 run_logs/（时序 CSV + 汇总 YAML）

# ---- Boids 群集（真正的集群算法：分离已有，对齐+聚合新增） ------------------
# 经典 Reynolds flocking：聚合（趋向邻居中心）+ 对齐（匹配邻居速度），配合 nav
# 的 separation（分离），编队从局部交互涌现（无领航、无中心）。
# 注意：与 formation.yaml（静态编队协调层）互斥，二者同时开启会打架。
swarm:
  enabled: true             # true=启用群集
  alignment_gain: 0.4       # 对齐权重：匹配邻居平均速度
  cohesion_gain: 0.2        # 聚合权重：趋向邻居平均位置
  perception_radius: 8.0    # 邻居感知半径 (m)，对齐/聚合用（覆盖全组）
  z_band: 0.5               # 邻居高度差阈值 (m)：只与同高度带邻居交互，避免
                            # 爬升/下降中的无人机被水平拉向巡航邻居
  min_z: 2.0                # 低于该高度不启用（避免起降/投放干扰）
  obstacle_scale: true      # 近障碍(<2m)时缩放群集力，防被拉进树

# ---- 闭环感知规划（去掉"上帝视角"） ------------------------------------------
# enabled=true ：nav 只消费 lidar 点云，累积成全局持久占用图（SLAM），在带定位
#                漂移的置信位姿上做全局 A*，不再读 scene 真值占用；lidar 模拟
#                Mid-360 式顶盲锥。
# enabled=false：回退真值全局 A*（原版 god-mode）。
closed_loop:
  enabled: true            # true=点云闭环全局规划；false=真值全局 A*（原版）
  drift_rate: 0.006        # 定位漂移随机游走速率 (m/step @ replan_hz)，慢累积≈150s 到 ~0.2m
  drift_max: 0.3           # 漂移上限 (m)
  lidar_top_blind: true    # 顶盲锥（Mid-360 式，正上方盲区）
  replan_hz: 10            # 漂移更新 / 控制频率 (Hz)
  max_vel: 1.5             # 闭环巡航限速 (m/s)，低于全局 default_max_vel，留反应余量
  # ---- P1 时间一致性（DeFoP §anti-oscillation 移植） --------------------------------
  # (a) 路径粘滞：全局 A* 路径设最短驻留 stick_s，期间不重选，除非 路径被新占用格
  #     切断 / 碰撞事件 / 新 goal——治"绕树左右两解等代价时每 0.5s 重选来回翻"。
  # (b) 方向翻转锁定：滑窗监测水平指令相对 goal 连线的侧向符号翻转率，超阈值且
  #     近障碍时锁定当前侧、加小偏置，clearance 解锁或超时——治反应层合力抖动。
  # enabled=false 时逐位保持原行为（每 0.5s 无条件重建+重选）。
  temporal_consistency:
    enabled: false         # 【默认关】2026-08-30 4臂×seed矩阵定论（run_logs/matrix_20260830_163547）：
                           # 无风 B 臂略劣于 A 基线（PASS 均分 154.0 vs 156.25，DONE +23s，碰撞 3.75 vs 1.75）→ 不翻默认；
                           # 风场 D 臂显著占优（碰撞 8.0 vs 13.5，stuck 85 vs 172s，DONE -47s，+6 分）
                           # → 开 wind 压测时建议同步开 tc。待 P1.1 进展门控重选后重评
    stick_s: 1.5           # 路径最短驻留 (s)
    flip_window_s: 2.0     # 翻转率监测窗口 (s)（翻转计数本身无论开关都采样，供 P0 指标）
    flip_rate_max: 0.6     # 翻转率阈值 (次/s)，超过且近障碍才锁定
    bias_gain: 0.35        # 锁定期侧向偏置幅值 (m/s)
    unlock_clearance: 1.5  # 解锁所需最小 clearance (m)
    max_lock_s: 6.0        # 单次锁定最长时长 (s)，防永久锁

  # ---- 漂移感知裕度（2026-08-31 碰撞法证产物） ----------------------------------
  # 点云是真值系（lidar 真值位姿 raycast）、clearance 测量无偏；但控制几何在
  # est 系（est=truth+drift）。漂移背向最近障碍（drift·u<0）时 est 距离比真值
  # 大 |drift·u|——控制器高估裕度，真值裕度被侵蚀，与 vcap 的 0.35 速度地板
  # 叠加 → 低速贴树挤入（live 158 分 run 三次碰撞接触时速度 0.12-0.98 m/s，
  # 全为慢挤入形态，无高速撞击）。机制：vcap 改用有效裕度
  # eff = clearance − max(0, −drift·u)，且 0.35 地板随侵蚀占比线性衰减到 0
  # （连续不冻结，避开 P2 scale→0 磨树病灶）。enabled=false 逐位原行为。
  drift_aware_margin:
    enabled: false          # 【默认关】2026-08-31 同码 A/B（run_logs/dam_20260831_181122，
                            # seed 42/43/45 双臂）：col 4.0→2.67、minclr 0.266→0.291
                            # 有改善，但 P42 stuck 42→238s（+195s，终态速度 0.07-0.11
                            # m/s 冰川爬行）、P45 满窗口 FAIL（456s 耗尽时 5 机仍在
                            # 投放松放，sleep=0 排除断档；O45 同 seed 155s PASS）。
                            # 根因：漂移是持续向量（随机游走饱和 0.3 后不归零），任务
                            # 走廊与漂移大面积背对时整条腿 vcap 地板衰减到 0——机制
                            # 从"贴脸保护"退化为任务级减速，seed 间差异即漂移方向
                            # 随 seed 变化。重评条件：真机移植（真实定位误差非持续
                            # 向量）。
                            # 【v2 亦否决 2026-09-02】A/B（run_logs/dam2_20260902_165420，
                            # seed 42/43/45 双臂全 PASS）：门控生效——无 P45-style
                            # 满窗 FAIL、P42 stuck 28.6s 正常，任务级减速确认修掉；
                            # 但 col 反向恶化 3.67→6.00（三对 seed 全部 P>O 一致
                            # 方向）、done +36s。机理教训：挤入形态下"贴脸带减速"
                            # =延长暴露时间=接触机会增多；v1 全域减速反而因减少
                            # 暴露而少碰。速度地板是暴露时长调节器，不是安全项。
                            # dam 路线（v1/v2）就此判死；重评条件仅剩真机移植。
    deep_r: 0.7             # 深近区半径 (m)：eff 低于该值地板才开始衰减。0.7 恰
                            # 为基线地板 bind 边界（max(0.35, clr/2) 中 clr<0.7），
                            # dam 只接管基线本来就要兜底的带，干预面最小

  # ---- 近停区（碰撞法证另一半机制：vcap 地板贴脸不封零） ------------------------------
  # 2026-08-31 live 158 分 run 三次碰撞全为低速贴树挤入（接触时 0.12-0.98 m/s）：
  # vcap 地板 0.35 意味着贴脸仍保底 0.53m/s，goal/云推力把平衡点压进真值接触。
  # near_stop_zone：距 goal<zone_r 时该地板线性衰减，deadband 处归零——目标点
  # 附近允许真正刹停。仅作用非 dam 分支；de 逃逸期间不衰减（地板是安全项）。
  # 【默认关】2026-09-01 同码 A/B（run_logs/batch1_20260901_145602，seed 42/43/45
  # 双臂，同矩阵另测膨胀臂）：全指标在跑次方差内——score 153.7 vs 154.7、
  # col 3.67 vs 2.67、stuck 52.1 vs 71.7s、minclr 0.290 vs 0.296、双臂 6/6
  # PASS。无独立收益：现行碰撞群集在走廊而非 goal 邻域，机制无标可打；
  # 保留实现，待"goal 邻域挤入"新形态出现时重评。
  near_stop_zone:
    enabled: false          # 【默认关】见上判词；A/B：run_logs/batch1_*
    zone_r: 1.0             # 近停区半径 (m)，距 goal 小于该值地板开始衰减
    deadband: 0.2           # 距 goal 该值内地板恒 0（允许微调刹停）

  # ---- P3 死端基元逃逸（DeFoP motion primitives 移植，仅借死端脱困） ----------------
  # 矩阵实测 2/14 cell FAIL 同因：碰撞标记（自机 est 格）膨胀成壳封死自格 →
  # _plan_global None → 永久悬停。触发后做基元逃逸：n_dirs 个均匀方向在占用栅格
  # 上射线评分（允许穿过 ≤pierce 格标记壳、验证 free_need 连续自由采样），
  # 选 score=可达距离+goal_bias·cos(方向,goal) 的方向以慢速驶出；规划恢复立即
  # 退出。无可行方向（全部 reach=0）保持悬停重试——绝不盲冲占用格。
  # 反应避障/分离/限速全程有效；逃逸只在规划失败时激活，正常飞行零影响。
  # 【2026-08-30 翻默认 true】三层机制（起点侧基元逃逸 + 目标容忍孔径规划 + gs 有界兜底），
  # 验证：矩阵 2/14 FAIL（起点侧封锁死锁）+ P3 验证 2 FAIL（目标封锁停车）形态全部
  # 修复；de=on 累计 10 run（seed 42/44/45/46/47/48/49/50，含 tc=on）全 PASS
  # 151-157 分，与基线分差在跑次方差内。触发日志：DEAD-END / GOAL-SEAL（rosout）。
  # 【2026-08-30 P2 修复包随带更新】①规划失败不再清空 _gpath（末次有效路径保持，
  #   治"规划翻 flap→指令间歇归零"停滞；A43 基线 456s 超时 FAIL→PASS 156/165s），
  #   de 触发/退出判据随之从 "_gpath is None" 改为规划失败连续时长
  #   (_plan_fail_since)；②逃逸方向新增点云走廊前置检查（cloud_clear_r）。
  #   验证 run_logs/p2b_*：B 臂 5/5 PASS 磨树归零，A43r PASS。
  # 【2026-08-31 P5 退出迟滞】est 在膨胀标记/树格边缘时规划成败逐拍翻转
  #   （单次成功窗口 <2s），单次成功即退出 → 逃逸频繁进出、停在云推力平衡点
  #   原地 flap（B43r drone5 累计 stuck 772.9s 仍 DONE，de 两进两出 1.6s/0.5s）。
  #   改为规划【连续】稳定 exit_hyst_s 才退出，迟滞期间继续沿逃逸方向驶出，
  #   把自机推离标记边缘后规划自然持续稳定。代价：真正恢复后多飞 ≤2.5s 慢速
  #   逃逸方向（0.6m/s、方向经云走廊验证，安全侧）。
  #   验证（run_logs/p5_* p5b_* p5d_*，seed43 双臂同码 A/B + 回归 spot）：
  #   ① in-vivo ~30 次 episode 全部 ≥3.1s、engage/done 严格 1:1——<2s 碎
  #     flap 结构性消失（B43r 形态在 16 run 中未再现，累计 stuck 回落 ~33s/run）；
  #   ② P5 臂（hyst=2.5）seed43 ×8 = 6/8 PASS vs 旧行为臂（hyst=0）×4 = 4/4，
  #     FAIL 率差在小样本噪声内（Fisher p≈0.44）；col/run 两臂同为 2.75，
  #     PASS 均分 155.3 vs 154.0；两次 FAIL（B43p3/H0b）均为满窗口超时（全机
  #     仍在动、无 stall、de 早于窗口尾 4.5min 收敛，时间账排除迟滞致因：
  #     全场逃逸总耗时 ~30s << 缺口 >250s）；
  #   ③ 干净 seed（B42p 157/155s）与风场（D43p 148/335s）回归无劣化。
  #   【默认 2.5 保留】。后续 CSV 法证（2026-08-31，nav_metrics_ts.csv 墙钟
  #   分桶）推翻"返航段慢速绕行"假说：B43p3 运行中段有 540s 墙钟断档（机器
  #   睡眠——进程冻结而墙钟窗口照烧，唤醒后即刻判死），FAIL 前 ~120s 飞行
  #   节奏正常；CSV 全库无一个"干净满窗口 FAIL"（干净 run 14/14 PASS，
  #   155-335s，每机里程 ~110m 与快 run 持平）。满窗口 FAIL = 睡眠污染，
  #   非策略缺陷；matrix_run 已加 wall-monotonic 漂移检测（>30s 判污染，
  #   现场留档 __contaminated 并自动重跑）。
  deadend_escape:
    enabled: true
    confirm_s: 0.5          # 规划连续失败该时长才触发（防瞬态 None 误触发）
    dwell_s: 1.2            # 单方向驻留 (s)，到期重评分（栅格/标记已更新）
    speed: 0.6              # 逃逸速度 (m/s)，慢速防二次碰撞
    ray_len: 3.0            # 方向评分射线长 (m)
    n_dirs: 16              # 候选方向数（均匀圆周）
    pierce_cells: 8         # 允许穿过的占用采样数（标记壳 ~2 格 ≈ 5-6 个采样）
    free_need: 3            # 验证所需的连续自由采样数（3×0.25m）
    goal_bias: 1.5          # goal 对齐权重（与可达距离同量纲）
    goal_stall_s: 3.0       # P3b 目标封锁直达触发：goal 格被占且停滞该时长 (s)
    goal_speed: 0.8         # P3b 直达逼近速度 (m/s)
    goal_max_s: 10.0        # P3b 单次直达周期上限 (s)，超时回正常规划（周期性试探）
    cloud_clear_r: 1.0      # P2 修复：逃逸方向沿线上该距离(m)内有点云障碍即淘汰
                            # （栅格壳可穿≠真树可穿；真树近旁的逃逸方向会被否决
                            # 层冻结成磨树级联——P2 矩阵 B 臂 highZ 磨树 40:0 教训）
    exit_hyst_s: 2.5        # P5 退出迟滞 (s)：规划连续稳定该时长才退出逃逸
                            # （治规划逐拍翻转 flap：单次成功即退出 → de 频繁进出、
                            # 云推力平衡点原地卡死；B43r 累计 stuck 772.9s 教训。
                            # 取值 > 实测单次成功窗口 ~1-2s；0=旧行为，A/B 见上）

  # ---- P4 滑窗点缓存（DeFoP M3 移植） ----------------------------------------------
  # 占用格时间戳化：重观测刷新，超 ttl_s 未重观测的格衰减（重建时惰性剪枝）。
  # 治"只加不删"的两个病灶：①噪声/漂移错位格永生，树周涂抹+膨胀加宽封锁带
  # （起点/目标自封的高发土壤）；②被重观测证伪的旧格不消失。无重观测区域
  # 保持记忆（远处真树仍被规划绕开，不是清空地图）。碰撞标记（事件真值）
  # 独立持久，不随窗衰减。enabled=false 逐位原行为（持久集合）。
  # 【默认关】2026-08-31 同码 A/B（run_logs/p4_* p4b_*，双臂×seed 43/45/42；
  # p4 首轮 O45/O42 跨机器休眠被 ROS 传输劣化污染，p4b 干净重跑）：
  # 双臂 3/3 PASS（O 均分 154.0 vs P 155.0；col 4.7:3.3、stuck 55.9:42.6s、
  # flips 309:282——P 臂各次要指标略优但均在跑次方差内）；机制指标 de 触发
  # 3.7:4.7 次/run（P 臂"地图遗忘→路径切→规划短失败"churn 使 de 略升）、
  # gs 0.67:0.67 无差异。150-200s 任务太短，TTL 45s 的收益（清陈旧格）与
  # 代价（遗忘 churn）近似相消 → 默认关，零风险口径与 P1/P2 一致。
  # 重评条件：任务时长显著变长（漂移涂抹变大）或出现"陈旧格封路"新形态。
  point_cache:
    enabled: false          # 【默认关】A/B 无净差异（见上）；长任务/强漂移场景可开
    ttl_s: 45.0             # 滑窗时长 (s)：超过该时长未重观测的 lidar 占用格衰减。
                            # 量级依据：drift 随机游走 ~0.06m/√s 误差达半格(res/2)
                            # 需 ~170s（任务时长内漂移涂抹有限），故 ttl 主要清
                            # 噪声幻影与重观测区错位旧格，取 45s 保远处记忆足够
                            # 覆盖一次穿越规划 horizon，又不至于把幻影留满全场

  # ---- P2 指令否决层（DeFoP M1 几何安全监督移植） --------------------------------
  # 指令层最后一道几何保证：对【最终发布指令】（群集/分离/避障/风前馈合成之后）
  # 做刹车包络检查——沿指令方向扫点云走廊（半宽 = drone_radius + lateral_margin，
  # 只计 t>0 的前方点，保证"永不阻挡远离/切向"），取最近沿轨距离 t_near，允许
  # 速度 v_a 满足  v_now·t_react + v_a²/(2·a_brake) + margin ≤ t_near；
  # 超速则等比缩水平指令到 v_a（只缩模不改向）。与 vcap（全向 clearance 减速）
  # 互补：vcap 惩罚逃逸方向，否决层只约束"指向障碍"的分量，切向绕行不受罚。
  # 纯检查层，不反馈进规划（无振荡回路）；关=逐位原行为。
  # 【默认关】2026-08-30 两轮 A/B 定论（run_logs/p2_20260830_202630 + p2b_*）：
  # 首轮 scale 可到 0 → B 臂 highZ 磨树级联 40:0、2 FAIL（veto 冻结弹起后水平
  # 脱离/冻结 de 逃逸指令）；修复包（de 点云走廊检查 + scale_min 地板 + 末次路径
  # 保持 + 停滞看门狗）后 B 臂 5/5 PASS、磨树归零、与 A 臂打平（分 155.0 vs 155.6、
  # 碰撞 16:16）；风场 D 臂无净收益（分 146.5 vs 150）。本栈 vcap+云避障+de 已
  # 覆盖同款几何，否决层冗余且风场略亏 → 保持关。修复包本身独立生效（A43 基线
  # FAIL→PASS），随 de/规划默认带出。若未来出现"指令驱动型碰撞"新形态可重评。
  veto_gate:
    enabled: false          # 【默认关】两轮 A/B 无净收益（见上）
    t_react: 0.2            # 指令跟踪滞后 (s)：现速 v_now 在该时间内按未衰减计
    a_brake: 2.5            # 紧急制动减速度 (m/s²)。保守取值（平台 max_acc=4.0 的
                            # 下界），包络偏大→提前减速，监督层宁紧勿松
    margin: 0.3             # 沿轨安全余量 (m)：包络停住后距障碍的最小距离
    lateral_margin: 0.1     # 走廊半宽加宽 (m)：半宽 = drone_radius + 该值（仅体表
                            # 余量；贴近树侧向绕行不被否决，贴近状态归反应层管）
    ray: 2.5                # 扫描上限 (m)（性能界；最近走廊点超出则必然不触发）
    scale_min: 0.35         # 缩放地板：对齐 vcap 0.35 系数——减速但不完全冻结水平
                            # 进度（scale→0 把"弹起后水平脱离"冻死成磨树级联，
                            # 2026-08-30 P2 首轮矩阵 B 臂 highZ 磨树 40:0 教训）

# ---- 碰撞恢复 ----------------------------------------------------------------
# 碰撞后弹开 + 冷却 + 恢复，替代永久冻结。
# enabled=false 回退到原行为（碰撞后永久冻结）。
collision:
  recovery:
    enabled: true             # false=永久冻结（原行为）
    bounce_dt: 1.0            # 弹开阶段持续 (s)
    cooldown_dt: 2.0          # 冷却冻结阶段 (s)，弹开后悬停等待
    bounce_vel: 2.0           # 弹开速度 (m/s)，≤ cascade_pid.max_vel (2.5)
    max_collisions: 8          # 超过此次数永久冻结（R1 调参 3→5→8：风场启用后窄走廊
                              # 阵风瞬态会撞树，碰撞标记逐次封堵树丛需 ~5-7 次/机才绕开；
                              # 8 次保任务完成，撞树仍作保真度信号。无风基线 0-1 次/机）

# ---- 传感器噪声 ----------------------------------------------------------------
sensor:
  lidar:
    range_noise_std: 0.02     # 测距噪声标准差 (m)，与距离成正比
    dropout_rate: 0.05        # 射线随机丢失率 (0-1)
    angular_noise_deg: 0.5    # 角度噪声 (deg)，使射线方向微偏
    false_positive_rate: 0.0  # 随机误检率 (0-1)，默认关（真机 lidar 误检率低）
  tag:
    range_noise_std: 0.05     # 距离测量噪声 (m)，影响 confidence
    false_negative_rate: 0.05 # 漏检率，与距离成正比（越远越易漏检）

# ---- 时间管理 ----------------------------------------------------------------
world_dt: 0.01             # 物理步进
control_dt: 0.05           # 指令下发周期
publish_dt: 0.05           # odom 发布周期
use_sim_time: true         # 平台发布 /clock，全图使用 sim time

# ---- 风场模型（仅作用于无人机动力学，树冠保持仅视觉） -----------------------
# 物理：acc += (wind - vel)/tau_aero（气动阻力拖向风速），控制器下一拍自然反推。
# 组成：定常风 mean + 共享慢变阵风（OU, τ=gust_timescale_s）+ 每机独立湍流
#       （OU, τ=turb_timescale_s）。只加水平分量（垂直由任务高度控制）。
# 门控：仅 P4_EXECUTE（穿越/投放/返航）生效；P1/P2 停靠、P3 起飞、P5 后不施风。
#       P3 起飞窗口不施风：pads 1.5m 间隔 + 错峰起飞是碰撞最脆弱窗口（R1 实测）。
# 冷却冻结期跳过。
# 约束：持续风必须 < ~0.8 m/s（无前馈时导航平衡偏移 δ=w/1.2 vs 投放到位阈值 0.8m）。
# R1 验证：无前馈时任何有意义风档（0.4/0.25、0.25/0.15、0.2/0.1 均试过）都让任务
#   无法完成——风致横漂撞树 → _collision_obs 永久占用 → 投放点不可达 → 接近死循环。
#   修复：nav 风前馈（feedforward=1.0，nav_node 指令减去共享风）→ 稳态偏移降 ~6 倍，
#   0.4/0.25 档可恢复正常任务节奏。每机湍流不补偿（残差抖动，符合真实系统）。
# 验证矩阵（swarm 开）：R1 单独风 DONE@360s/152 分/13 撞全恢复；R3 风+通信
#   DONE@347s/148 分/13 撞全恢复，均 6/6 DONE+MATCH 无永久冻结。
# 【默认关】：用户决策——保持零侵入基线，压力测试时手动开（enabled 改 true）。
wind:
  enabled: false           # 【默认关】压力测试时改 true
  mean: [0.0, 0.0]         # 定常风 (m/s)，z 恒 0
  gust_std: 0.4            # 共享阵风 OU 标准差 (m/s)（typical≈0.47、峰值≈1.2）
  gust_timescale_s: 4.0    # 阵风相关时间 (s)
  turb_std: 0.25           # 每机湍流 OU 标准差 (m/s)
  turb_timescale_s: 1.0    # 湍流相关时间 (s)
  tau_aero: 0.6            # 气动响应时间常数 (s)
  feedforward: 1.0         # nav 风前馈系数（0=关；1=全补偿共享风）

# ---- 通信模型（邻居信息无线链路：延迟 + 丢包 + 突发丢失） --------------------
# 独立中继节点 comm_model_node：订阅全部 /drone_i/odom，对每条链路 (s→r, s≠r)
# 施加模型后发布 /drone_<r>/odom_from_<s>；本机 odom 不经过模型（自身传感器，
# 定位不确定性由 closed_loop.drift 覆盖）。失联语义：nav 侧超过 expire_s 未更新
# 的邻居被移除（"感知不到的避不开"，群集/分离自然跳过）。
# 注意：release 必须发布队列【最老】q[0]（FIFO）——发布"最新"（newest-wins）会
# 把有效延迟塌缩成 ~1 帧（R2 假通过教训，实测 10ms→修复后 155ms）。
# 验证矩阵（swarm 开）：R2 单独通信 DONE@176s/153 分/1 撞已恢复；R3 风+通信
#   DONE@347s/148 分/13 撞全恢复，均 6/6 DONE+MATCH 无永久冻结。
# 【默认关】：用户决策——保持零侵入基线，压力测试时手动开（enabled 改 true）。
comms:
  enabled: false           # 【默认关】压力测试时改 true
  latency_ms: 100          # 基础单程延迟 (ms)
  latency_jitter_ms: 40    # 每消息抖动，均匀 0..jitter (ms)
  dropout_rate: 0.02       # 单消息独立丢包率 (0-1)
  burst_prob: 0.002        # 突发丢失起始概率（每链路每秒）
  burst_len: [3, 10]       # 突发 = 连续丢 K 条消息
  expire_s: 2.0            # nav 侧邻居过期时间 (s)
