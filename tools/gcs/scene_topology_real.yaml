# =============================================================================
# scene_topology_real.yaml — 科目三 真机场地拓扑（非凸α 实机，2026-09-26）
# =============================================================================
# 部署：deploy_real.sh 拷机载换名 src/zx2026_common/config/scene_topology.yaml
#（Scene 硬编码文件名 scene.py:92——与 sim_settings 换名同款套路）。
# WSL sim 永远跑 config/ 原杨树林文件，本文件不影响仿真一分。
#
# 坐标口径（用户定谳 2026-09-26）：
#   - 场地 50m × 50m，原点=西南角，x 东 y 北（用户实测口径，坐标原样入文件）
#   - 投放平台贴地（台面 z=0），投放点的 z=1.5 是【释放悬停高度】口径；
#     executor 不消费 dp.xyz 的 z（行为高度全走 competition_rules heights），
#     这里落值作审计基准
#   - 围栏网就在 x=0 / x=50 / y=0 / y=50 边界线上，平台贴网
#
# ⚠ 起飞前必测（不测必卡投放）：
#   1. 平台中心真实 xy——(50, y) 若是网线名义位，贴网平台中心 ≈ 49.3~49.5，
#      悬停点=平台心，离网面须 ≥0.5m（反应半径 react_r=dr+0.15≈0.5）；
#      平台 1 在东南网角上（到东/南两面网距离全 0）——三个中心坐标是
#      必测项之首，实测后只改下方 drop_points 的数字
#   2. 起降 pads 6 点实测坐标（下方为占位；executor 起飞/返航/降落全吃
#      scene.get_pads()，missions.yaml 的 takeoff 不参与飞行）
#   3. 网高（下方 fence 按 3.0m 占位）
#   4. 穿越区范围（下方按场地中带假定，按比赛规则原文实测改）
#
# 真机占用感知=激光点云闭环（cloud_adapter 四道滤→nav 建图），Scene 树表
# 留空不建模树——本文件零 forest 段是有意设计（部署探针有断言）。
# =============================================================================

venue:
  # size 是【栅格覆盖口径】非场地物理尺寸：nav 栅格中心原点 g_x0=-size/2
  #（硬编码），须罩住用户坐标 0..50 且网格边距 ≥5m——投放点 x=50 贴活动区
  # 东缘，size=50 时栅格只到 ±25 会把平台排除在 A* 图外；110 → 栅格 -55..55
  size: [110, 110, 6]
  ground_z: 0.0

zones:
  - id: takeoff
    kind: pad
    polygon: [[0, 22], [6, 22], [6, 26], [0, 26]]
    pads: 6
    pad_spacing: [2.0, 2.0]
    pad_origin: [1.0, 23.0]   # ⚠ 占位坐标——6 点实测后改（3 列 × 2 行）
  - id: transit
    kind: open_field          # 非 forest=零树（真机占用=点云，勿改回 forest）
    polygon: [[0, 0], [50, 0], [50, 50], [0, 50]]
  - id: return
    kind: ref
    ref: takeoff

# ---- 穿越区（EXECUTE 首腿飞向其重心；crossed_zone 判定/via_slots 候选域） ----
crossing_zone:
  polygon: [[15, 5], [45, 5], [45, 45], [15, 45]]   # ⚠ 中带假定——按规则实测改

# ---- 颜色权威源（三端共用，禁另设硬编码色表） --------------------------------
color_map:
  TYPE_A: red
  TYPE_B: blue
  TYPE_C: yellow

# ---- 投送平台（用户口径原样落值；平台中心 x 实测后改） ------------------------
drop_points:
  - id: 1
    xyz: [50.0, 0.0, 1.5]    # ⚠ 角上平台：到东/南两面网距离全 0，中心必测
    type_id: TYPE_A
    color: red
    marker: ""
  - id: 2
    xyz: [50.0, 2.0, 1.5]
    type_id: TYPE_B
    color: blue
    marker: ""
  - id: 3
    xyz: [50.0, 4.0, 1.5]
    type_id: TYPE_C
    color: yellow
    marker: ""

payload_types: [TYPE_A, TYPE_B, TYPE_C]

# ---- 静态障碍物（围栏网：face 在 0/50 边界线上，厚度向外 0.3） -----------------
# fence 不进 A* 占用（collides_xy 跳过），消费点=boundary_margin 反应层 +
# collides 硬碰撞兜底；网本身在点云里=真实占用。网高 3.0 占位（z 豁免带：
# 网顶 3.0 > 悬停 1.5 → 贴网段反应层恒介入，悬停点必须离网面 ≥0.5m）。
static_obstacles:
  - kind: fence
    lo: [-0.30, -0.30, 0.0]
    hi: [  0.00, 50.30, 3.0]
  - kind: fence
    lo: [ 50.00, -0.30, 0.0]
    hi: [ 50.30, 50.30, 3.0]
  - kind: fence
    lo: [-0.30, -0.30, 0.0]
    hi: [ 50.30,  0.00, 3.0]
  - kind: fence
    lo: [-0.30, 50.00, 0.0]
    hi: [ 50.30, 50.30, 3.0]
