# GCS profile — 真机 LIO（MID360 + faster_lio），每机一个 agent
# 部署: 拷到机载 ~/Diff-planner/tools/ 下, server 填地面站笔记本 IP
profile: real_lio
mode: real                    # 一级开关：real=起飞先行+POWER/FC 门+危险命令 --yes
                              # (hub 侧须加 --bat-min 30 才有 LOW_BAT 告警)
server: 192.168.1.10:9870     # TODO(联调日第一件事) 现场按地面站实际 IP 改
send_hz: 5.0
ids: [0]                      # 单 agent 带本机: 写 [DRONE_ID] 的值
topics:
  odom: /drone_{id}/odom      # odom_tf 输出（ENU；2026-09-26 真机适配改挂）——
                              #   变换链 /ekf/ekf_odom(LIO 局部系，官方 fork
                              #   laser_mapping.cc:309 → ekf_lidar.launch 融合)
                              #   → odom_tf 三桥共用变换 → ENU。agent 上报本
                              #   输出即遥测/邻机 fleet 全 ENU，agent 内置
                              #   pose_tf 恒等退役（见下段）
  phase: null                 # 源码定论: multipoint 无状态机话题（multipointplan.cpp
                              #   只发 takeoff_land/move_base_simple/goal/back_trigger/
                              #   goal/planning_yaw）——任务终态判定走 MONITOR_TIMEOUT
                              #   语义（盯飞超时=转 hub dash 人工盯）
  battery: /mavros/battery    # sensor_msgs/BatteryState
  fc: /mavros/state           # mavros_msgs/State (connected/mode)
  liveness:                   # vel_bridge 50Hz 定时器直发（恒频贯穿悬停+任务
    - /position_cmd           #   两态；桥死=断流=PLANNER_DEAD 告警，语义最优）
  stage: null                 # 仅 1 号机 profile 改 /zx2026/state（本地
                              #   stage_controller 直发+上报）；其余机保持
                              #   null=本机无本地源，fleet 回声经 --fleet-bridge
                              #   转 ROS（防阶段倒退竞态的 echo 门即此键）
  grid: null                  # TODO 真机建图上屏: grid_map/occupancy 是 PointCloud2
                              #   (需独立适配器), 与仿真 OccupancyGrid 不同型
  score: null                 # 真机无 scorekeeper——比分条显示 --
  mission: /zx2026/mission/{id}   # mission_loader 本地装订输出（latched）——
                              #   hub 指派显示+FR-2.8 阶段推断的参考投放点
  task: /zx2026/task_update   # 本机 mission_executor 直发（他机进度经 fleet
                              #   回声补全，本桥 skip 自身防重复）
  match: null                 # TODO 真机类型匹配适配器（FR-1.8）
  drop_done: null             # TODO 真机投放确认适配器（FR-1.8）
  metrics: /drone_{id}/nav_metrics   # settings_real nav.metrics.enabled=true
                              #   → nav 直发 11 项；FR-1.7 碰撞/clearance 上屏
  match_progress: null        # TODO 真机匹配进度适配器（FR-1.9）
  grid_cloud: null            # TODO 现场定 LIO 累积点云 topic（FR-1.4 real 建图）——
                              #   cloud_adapter.py --src 同步此名（2026-09-18 落地）

# 坐标对齐——【2026-09-26 起 agent pose_tf 段退役】：变换统一归 odom_tf 节点
# 管（nav/mission/vel_bridge/cloud_adapter/agent 全链共用一份，防双重变换）。
# 参数改在 real_fleet.launch 传三桥同源 CLI（--yaw0-deg/--ex0/--ny0）：
#   yaw0_deg = LIO 系 x 轴相对 ENU 东向的偏角（逆时针正）——起飞对场地标线后填；
#              若上电点桩位+标线对齐良好，此项可为 0（联调日按建图叠先验布局校）
#   ex0/ny0  = 上电点在 ENU 的坐标（米）；上电点=ENU 原点桩位时保持 0
#   auto_origin（静止窗扣 LIO 初始化偏置 c、空中重启放弃不猜）在 odom_tf
#   内建——此段键值必须保持删除/全零：agent 再留非零值=双重变换（遥测错位）
#   agent 侧按"无 pose_tf 键"恒等直报 /drone_{id}/odom 的 ENU 输出。

# GCS 操作编排（gcs_ops.py）——真机命令模板（ssh 逐机执行）
# 脚本语义（sh_files 源码核实）: takeoff/land = /px4ctrl/takeoff_land cmd 1/2；
# back = /back_trigger；trigger(pub_trigger) = /move_base_simple/goal 一帧
# PoseStamped 触发 multipoint 预设航点（points.yaml/flight_type 决定航点）。
# 脚本为 zsh 且 source 相对路径 —— 必须 cd 工作空间根再执行。
# ssh 三参数纪律: BatchMode=yes 免密失败即报错(不挂 15s 等 TTY 输密码——
#   subprocess 无 TTY 根本输不了)、ConnectTimeout=5 断网快败、
#   StrictHostKeyChecking=accept-new 首连不卡 known_hosts 确认
#   (accept-new 需地面站 OpenSSH>=7.6; Ubuntu 20.04 自带 8.2 满足,
#   老机器兜底=ssh-keyscan 预灌 known_hosts 后去掉该参数)。
# TODO①② 已脚本化（2026-09-18）: bash tools/gcs/provision_real.sh
#   （ping+免密+Diff-planner 三探针逐机验，--server 回填本字段；勿用 sshpass）。
#   目录大小写已按实机证据定 Diff-planner（小写 p, 手册写错大写 P）——
#   联调日仍跑 DEBUG 窗 ws 探针（ls -d ~/Diff*）一次复核。
#   panic=逐机 ssh land，交付前必须 no-prop bench（tools/gcs/bench_check.sh）
#   实弹验证，vel_bridge 注入点/安全语义见 gcs_runbook §3.1。
#   【2026-09-26 单机试飞钉死】cmds/debug_ssh host=nv@192.168.31.76（实机）；
#   多机现场按 IP 分配表重填并恢复 {id} 占位。server 字段=agent 上报目标
#   （地面站 IP），仍留 TODO 联调日现场定。
ops:
  status_file: /home/ubuntu/zx2026_arena_ws/run_logs/gcs_status.json
  shell_prefix: ""
  cmds:
    trigger: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76 'cd ~/Diff-planner && ./sh_files/pub_trigger.sh'"
    takeoff: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76 'cd ~/Diff-planner && ./sh_files/takeoff.sh'"
    back: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76 'cd ~/Diff-planner && ./sh_files/back.sh'"
    land: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76 'cd ~/Diff-planner && ./sh_files/land.sh'"
    panic: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76 'cd ~/Diff-planner && ./sh_files/land.sh'"

  # 贫机 MAVLink 轨（P0-② panic 双轨化，2026-09-24 落地）：机载零代码的
  # PX4+RTK 贫机无 ssh 通道，land/back/panic 经 gcs_mavlink_bridge.py
  # 命令口下发（bridge --connect udpin:0.0.0.0:14550 --map "2:1,3:2" ...
  # 同时吃贫机遥测上行→hub）。富机保持上面 cmds 的 ssh 模板；两轨
  # per-drone 混跑互不依赖。E2E: tools/gcs/_e2e_panic.sh（d0 模板轨 /
  # d1 MAVLink 轨 + fake PX4 实收 COMMAND_LONG 全绿）。
  mavlink:
    cmd_addr: 127.0.0.1:9871    # bridge 命令口（bridge 跑在地面站本机）
    ids: []                     # TODO(联调日) 按编队填贫机 did，如 [1, 2, 3]
    cruise_z: 2.0               # 贫机任务平飞高(m, RELATIVE_ALT=ENU u 同口径)
    takeoff_z: 2.5              # 贫机起飞目标高(m)——deploy 进场段用
    missions: {}                # 贫机静态指派 did -> [[e,n,z],...]（ENU 米）；
                                #   赛前三投放点 GPS→ENU 换算后填；CLI 覆盖用
                                #   `deploy --wps "e,n,z;..." --ids <贫机>`。
                                #   阶段闸门：recon(强机侦察)→gate(覆盖率/
                                #   人工放行)→deploy(贫机 mission+takeoff)
    safety_params: {}           # 贫机起飞前参数装订（deploy 逐机 param_set）：
                                #   PX4 geofence 防失控飞出赛区，如
                                #   GF_MAX_HOR_DIST: 50.0 / GF_MAX_VER_DIST: 8.0
                                #   / GF_ACTION: 3.0（RTL）——数值赛前定谳

  # 真机调试接口（面板 DEBUG 窗 / `ops debug <名> [args]`）——约定只读，
  # 写操作一律走上面 cmds（两段确认）。{args}=参数槽。
  # source 用 devel/setup.sh（POSIX）而非 setup.bash——登录 shell 是
  # zsh/bash 都通吃；远端命令含管道/重定向由 shlex.quote 整体保护。
  debug_ssh: "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new nv@192.168.31.76"
  debug_cmds:
    ping: "echo ok && hostname && uptime"
    ws: "ls -d ~/Diff* && ls ~/Diff-planner/sh_files/ | head"
    ros: "cd ~/Diff-planner && source devel/setup.sh && rostopic list"
    hz: "cd ~/Diff-planner && source devel/setup.sh && timeout 6 rostopic hz {args} -w 5 2>&1 | tee /dev/stderr | grep -q average"
    echo: "cd ~/Diff-planner && source devel/setup.sh && timeout 6 rostopic echo -n 3 {args}"
    node: "cd ~/Diff-planner && source devel/setup.sh && rosnode list | head -30"
    proc: "pgrep -af 'ros|python|px4' | head -25"
    res: "free -h | head -2 && df -h / | tail -1 && nvidia-smi --query-gpu=memory.used,temperature.gpu --format=csv,noheader"
    log: "tail -n 30 {args}"

  # preflight 真机探针（联调勘误自检，不阻断门）：依次跑 debug_cmds 里的命令。
  # ros=远端 ROS 环境（免密+目录+source 链路）一并自检
  probe:
    - ping
    - ws
    - ros
  stagger_s: 2.0
  retries: 2
  execute_timeout_s: 600.0
  time_limit_s: 600              # 科目总时限（FR-1.6 倒计时）
  gates:
    link_lost_s: 3.0
    max_vel: 0.10
    plan_dead_s: 5.0
    autonomy: plan                              # real: 规划流年龄
    pre_start_stages: ["P2_WAIT"]
    bat_min: 30.0                               # POWER 门 + LOW_BAT 告警门限(%)
    airborne_z: 0.5                             # 离地确认 z 门限(m)
    airborne_timeout_s: 60.0                    # 起飞后离地确认超时
